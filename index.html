<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Übungsblatt 4 - Bürgerbeteiligungskarte</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <!-- Überschrift und Position Karte unter Überschrift -->
        <h1>Bürgerbeteiligungskarte</h1>
        <h2>Bebauungsfläche im Neuenheimer Feld und verschiebbare Gebäude</h2>
        <div id="map"></div>
  
  <!-- OpenLayers und Proj4js-Library -->
  <script src="libs\ol-v10.3.1\ol.js"></script>
  <script src="libs/proj4js-2.15.0/proj4.js"></script>

  <!-- Kartenskript -->
  <script>

    // passende Projektion registrieren und anwenden
    proj4.defs("EPSG:32632","+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs +type=crs");
    ol.proj.proj4.register(proj4);

    // WMS-Layer
        const wmsLayer = new ol.layer.Tile({
      source: new ol.source.TileWMS({
        url: 'http://osmatrix.geog.uni-heidelberg.de:8080/geoserver/mauer/wms', // WMS-Server-URL
        params: {
          'LAYERS': 'mauer:ub4_baugebiet', // WMS-Layername
          'TILED': true,
          'FORMAT': 'image/png',
        },
      }),
    });

    // WFS-Layer: Quelle
        const wfsSource = new ol.source.Vector({
          format: new ol.format.GeoJSON(), // format which will be read by openlayers
          url:'http://osmatrix.geog.uni-heidelberg.de:8080/geoserver/mauer/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=mauer%3Aub4_bebauung&maxFeatures=50&outputFormat=application%2Fjson'
        });

    // WFS-Layer kreieren
        const wfsLayer = new ol.layer.Vector({
          source: wfsSource,
        });

    // OpenLayers Karte
    const map = new ol.Map({
      target: 'map',
      view: new ol.View({
        center: [475162.841, 5474408.722], // Zentrum: Neuenheimer Feld
        zoom: 17,
        projection: 'EPSG:32632' // selbst registrierte Projektion
      }),
      layers: [
        new ol.layer.Tile({
            source: new ol.source.OSM() // Hintergrund: OSM-Layer
            }),
        wmsLayer, // Flurstück
        wfsLayer // verschiebbare Gebäude
      ]
    });

    var select = new ol.interaction.Select({
      layers: [wfsLayer]
    });
    map.addInteraction(select); //"auswählen"-Interaktion

    var translate = new ol.interaction.Translate({
      layers: [wfsLayer]
    });
    map.addInteraction(translate); //"verschieben"-Interaktion

  </script>

</body>
</html>
